<!-- Attribut beispiele: -->

<!-- src Attribut (bestimmt welches Bild angezeigt wird) -->
<img src="Image.jpg">

<!-- href Attribut (bestimmt zu welcher webseite der link führt) -->
<a href="https://example.com/">click diesen link</a>

<!-- width Attribut (bestimmt wie breit das bild ist) -->
<img src="Image.jpg" width="200">

<!-- height Attribut (bestimmt wie hoch das bild ist) -->
<img src="Image.jpg" height="200">

<!-- alt Attribut (bestimmt welcher Text angezeigt wird, anstatt das bild, falls das bild nicht angezeigt werden kann) -->
<img src="Imag.jpg" alt="Hier sollte eigentlich ein buntes bild sein">

<!-- title Attribut (gibt dem bild ein titel) -->
<img src="Image.jpg" title="Buntes bild">

<!-- id Attribut (gibt dem element einen Identifikations text) -->
<button id="knopf1"></button>

<!-- class Attribut (gibt dem element einen oder mehrere Identifikations texte) -->
<button class="text1 text2 text3"></button>
